[pytest]
minversion = 7.0
testpaths = tests_e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    unit: Isolated unit tests verifying algorithmic and mathematical specifications
    integration: Integration tests between services, databases, and APIs
    e2e: End-to-end multi-tier platform workflow tests
    mock_device: Tests executing mobile/device logic against emulated software harnesses
    physical_device: Hardware tests requiring a physical Android device connected via adb
    security: Adversarial and boundary security verification tests
